# remoteplayer-mpvwatcher configuration for the Raspberry Pi.
# Installed as /etc/remoteplayer/mpvwatcher.toml (see README.md, "Installation").

# The IPC socket of remoteplayer-mpv.service.
mpv-socket = "/run/remoteplayer-mpv/mpv.sock"

# How long to wait for each reply from mpv before reconnecting.
request-timeout-seconds = 2

# Latest snapshot as JSON, replaced atomically and written only when it changes.
# remoteplayer-restservice reads this file (restore.watcher-state-file) to resume
# playback after mpv crashed: comment the line out and there is no state file,
# no periodic polling of mpv — and no automatic restore after a crash.
state-file = "/var/lib/remoteplayer-mpvwatcher/state.json"

# How often the state file is refreshed. Applies to the file only.
state-file-interval-seconds = 7

# The watcher's own IPC: answers the request line `get` with mpv's current state.
# Sends nothing unasked. Comment the line out to disable the socket.
state-socket = "/run/remoteplayer-mpvwatcher/state.sock"
